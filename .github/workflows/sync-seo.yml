name: Sync SEO from Firestore Content

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync SEO metadata into HTML files
        run: node scripts/sync-seo.mjs

      - name: Commit updated SEO metadata
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lt/*.html en/*.html index.html
            git commit -m "chore(seo): sync title and meta descriptions from Firestore content"
            git push
          else
            echo "No SEO changes detected."
          fi
