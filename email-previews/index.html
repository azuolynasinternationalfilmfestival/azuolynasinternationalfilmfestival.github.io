<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>AISFF Email Previews — Batch 2 Step 1</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #040d0b; color: #f8faf7; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    .toolbar { position: sticky; top: 0; z-index: 10; background: #071713; border-bottom: 1px solid #153d34; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
    .group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    button, a.raw-link { background: #0c241f; color: #bac9c0; border: 1px solid #1d4d42; border-radius: 6px; padding: 8px 12px; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; min-height: 38px; display: inline-flex; align-items: center; }
    button.active { background: #12372f; border-color: #34d399; color: #ffffff; }
    .stage { padding: 24px 12px 48px; display: flex; justify-content: center; }
    iframe { width: 640px; max-width: 100%; height: 860px; border: 1px solid #153d34; border-radius: 8px; background: #051512; transition: width 0.2s ease; }
    iframe.mobile { width: 375px; }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="group" id="templateButtons">
      <button type="button" class="active" data-src="lt-submission-received.html">LT: Paraiška gauta (1 autorius)</button>
      <button type="button" data-src="lt-admin-dossier.html">LT: Admin byla (komanda)</button>
      <button type="button" data-src="lt-remote-live-pass.html">LT: Nuotolinis žetonas</button>
      <button type="button" data-src="lt-winner.html">LT: Laureatas</button>
      <button type="button" data-src="en-submission-received.html">EN: Submission (crew)</button>
      <button type="button" data-src="en-remote-live-pass.html">EN: Live Pass</button>
      <button type="button" data-src="en-winner.html">EN: Winner</button>
    </div>
    <div class="group">
      <button type="button" class="active" id="btnDesktop">Desktop (640px)</button>
      <button type="button" id="btnMobile">Mobile (375px)</button>
      <a class="raw-link" id="rawLink" href="lt-submission-received.html" target="_blank">Atidaryti failą</a>
    </div>
  </div>
  <div class="stage">
    <iframe id="previewFrame" title="Email Preview" src="lt-submission-received.html"></iframe>
  </div>
  <script>
    const frame = document.getElementById('previewFrame');
    const rawLink = document.getElementById('rawLink');
    const buttons = document.querySelectorAll('#templateButtons button');
    const btnDesktop = document.getElementById('btnDesktop');
    const btnMobile = document.getElementById('btnMobile');

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const src = btn.getAttribute('data-src');
        frame.src = src;
        rawLink.href = src;
      });
    });

    btnDesktop.addEventListener('click', () => {
      frame.classList.remove('mobile');
      btnDesktop.classList.add('active');
      btnMobile.classList.remove('active');
    });

    btnMobile.addEventListener('click', () => {
      frame.classList.add('mobile');
      btnMobile.classList.add('active');
      btnDesktop.classList.remove('active');
    });
  </script>
</body>
</html>
