<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title id="pageTitle">Tiesioginė Transliacija | Ąžuolynas Film Fest</title>
  <meta name="description" id="metaDescription" content="Oficiali Ąžuolynas International Students Film Festival ceremonijos tiesioginė transliacija su autorizuota prieiga.">
  <link rel="icon" type="image/webp" href="https://firebasestorage.googleapis.com/v0/b/azuolynas-film-fest.firebasestorage.app/o/azuolynasfilmfest.webp?alt=media">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="live.css">
  <script src="error-reporting.js"></script>
  <style>
    /* Language switcher component */
    .live-lang-switch {
      display: inline-flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(111, 165, 138, 0.35);
      border-radius: 20px;
      padding: 2px 4px;
      gap: 3px;
    }
    .live-lang-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .live-lang-btn:hover {
      color: #F8FAF7;
    }
    .live-lang-btn.active {
      background: #D4AF37;
      color: #041310;
    }

    /* Zero-exposure gate layout */
    .token-gate-viewport {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      background: radial-gradient(circle at 50% 20%, rgba(12, 36, 31, 0.95) 0%, rgba(4, 19, 16, 0.98) 100%);
    }
    .gate-top-lang {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10;
    }
    .token-gate-card {
      background: rgba(8, 27, 23, 0.94);
      border: 1px solid rgba(212, 175, 55, 0.45);
      border-radius: var(--site-radius, 12px);
      padding: 40px 32px;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85);
      text-align: center;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-sizing: border-box;
    }
    .token-gate-icon {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.35);
      color: #D4AF37;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .token-gate-title {
      font-family: var(--font-cinema, Georgia, serif);
      font-size: 1.45rem;
      color: #F8FAF7;
      margin: 0 0 10px 0;
      letter-spacing: 0.03em;
    }
    .token-gate-desc {
      font-size: 0.88rem;
      color: #94a3b8;
      line-height: 1.5;
      margin: 0 0 24px 0;
    }
    .token-input-wrap {
      margin-bottom: 16px;
      text-align: left;
    }
    .token-input-wrap label {
      display: block;
      font-size: 0.8rem;
      color: #cbd5e1;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .token-input-field {
      width: 100%;
      padding: 12px 14px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(111, 165, 138, 0.35);
      border-radius: 6px;
      color: #F8FAF7;
      font-size: 1rem;
      letter-spacing: 0.05em;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      box-sizing: border-box;
    }
    .token-input-field:focus {
      border-color: #D4AF37;
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
    }
    .token-error-box {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.82rem;
      margin-bottom: 16px;
      text-align: left;
      line-height: 1.4;
    }
    .token-submit-btn {
      width: 100%;
      padding: 13px;
      background: #D4AF37;
      color: #041310;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }
    .token-submit-btn:hover {
      background: #F3E5AB;
      transform: translateY(-1px);
    }
    .token-submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .token-gate-help {
      margin-top: 22px;
      font-size: 0.78rem;
      color: #64748b;
      line-height: 1.4;
    }
    .token-gate-help a {
      color: #D4AF37;
      text-decoration: none;
    }
    .token-gate-help a:hover {
      text-decoration: underline;
    }

    /* =========================================================================
       LIVE PLAYER MOUNTED STAGE (Strict non-overlapping responsive flow)
       ========================================================================= */
    .live-player-stage {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 16px 48px 16px;
      width: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    /* Row 1: Festival Branding Header */
    .live-brand-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(111, 165, 138, 0.15);
    }
    .live-brand-logo {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 1px solid rgba(212, 175, 55, 0.4);
    }
    .live-brand-info {
      flex: 1;
      min-width: 0;
    }
    .live-brand-title {
      font-family: var(--font-cinema, Georgia, serif);
      font-size: clamp(1.1rem, 3.5vw, 1.45rem);
      color: #F8FAF7;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .live-brand-sub {
      font-size: clamp(0.72rem, 2.5vw, 0.8rem);
      color: #94a3b8;
      margin: 3px 0 0 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Row 2: Compact Action Toolbar (Wraps cleanly on small screens, NEVER overlaps player) */
    .live-toolbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      background: rgba(8, 27, 23, 0.7);
      border: 1px solid rgba(111, 165, 138, 0.25);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 16px;
      box-sizing: border-box;
    }
    .live-toolbar-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .live-toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .live-user-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(111, 165, 138, 0.18);
      border: 1px solid rgba(111, 165, 138, 0.35);
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 0.76rem;
      color: #F8FAF7;
      max-width: 240px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .live-user-pill.classroom {
      background: rgba(212, 175, 55, 0.15);
      border-color: rgba(212, 175, 55, 0.4);
      color: #F3E5AB;
    }
    .live-exit-btn {
      background: transparent;
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #f87171;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.74rem;
      cursor: pointer;
      transition: background 0.2s ease;
      white-space: nowrap;
    }
    .live-exit-btn:hover {
      background: rgba(239, 68, 68, 0.15);
    }

    /* Row 3: 16:9 Video Stage Container */
    .player-responsive-wrap {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #000000;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(212, 175, 55, 0.35);
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.85);
      margin-bottom: 16px;
    }
    .player-responsive-wrap iframe,
    .player-responsive-wrap video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Stream Offline State Overlay */
    .stream-offline-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, #081B17 0%, #030d0b 100%);
      color: #F8FAF7;
      text-align: center;
      padding: 20px;
      z-index: 5;
    }
    .stream-offline-pulse {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #eab308;
      box-shadow: 0 0 15px #eab308;
      margin-bottom: 14px;
      animation: asiffPulseDot 2s infinite ease-in-out;
    }
    @keyframes asiffPulseDot {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
    }
    .stream-offline-title {
      font-family: var(--font-cinema, Georgia, serif);
      font-size: clamp(1.1rem, 3vw, 1.35rem);
      color: #D4AF37;
      margin: 0 0 8px 0;
    }
    .stream-offline-desc {
      font-size: clamp(0.78rem, 2.5vw, 0.88rem);
      color: #94a3b8;
      max-width: 480px;
      line-height: 1.5;
      margin: 0 0 16px 0;
    }
    .stream-retry-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.74rem;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.06);
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid rgba(111, 165, 138, 0.2);
    }

    /* Row 4: Status Bar & Action Controls */
    .live-bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .live-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 500;
    }
    .live-status-pill.is-live {
      background: rgba(74, 222, 128, 0.15);
      border: 1px solid rgba(74, 222, 128, 0.4);
      color: #4ade80;
    }
    .live-status-pill.is-offline {
      background: rgba(234, 179, 8, 0.15);
      border: 1px solid rgba(234, 179, 8, 0.4);
      color: #facc15;
    }
    .live-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }
    .live-bottom-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn-fullscreen {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(111, 165, 138, 0.35);
      color: #cbd5e1;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-fullscreen:hover {
      background: rgba(212, 175, 55, 0.2);
      border-color: #D4AF37;
      color: #F8FAF7;
    }
    .btn-voting-direct {
      background: #D4AF37;
      color: #041310;
      padding: 7px 16px;
      font-size: 0.82rem;
      font-weight: 700;
      text-decoration: none;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s ease;
    }
    .btn-voting-direct:hover {
      background: #F3E5AB;
    }
  </style>
</head>
<body class="site-body">

  <!-- =========================================================================
       GATE VIEWPORT: CLEAN INITIAL TOKEN GATE
       ========================================================================= -->
  <div id="liveGateContainer" class="token-gate-viewport">
    
    <div class="gate-top-lang">
      <div class="live-lang-switch">
        <button type="button" class="live-lang-btn" data-lang="lt">LT</button>
        <button type="button" class="live-lang-btn" data-lang="en">EN</button>
      </div>
    </div>

    <div class="token-gate-card">
      <div class="token-gate-icon" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>

      <h1 class="token-gate-title" data-i18n="gateTitle">Transliacijos Prieiga</h1>
      <p class="token-gate-desc" data-i18n="gateDesc">
        Tiesioginė festivalio transliacija skirta autorizuotiems žiūrovams ir klasėms. Įveskite savo asmeninį arba klasės prieigos kodą.
      </p>

      <form id="tokenGateForm" action="javascript:void(0);">
        <div class="token-input-wrap">
          <label for="tokenInputField" data-i18n="tokenLabel">Prieigos kodas (Token) *</label>
          <input 
            type="text" 
            id="tokenInputField" 
            class="token-input-field" 
            placeholder="pvz. asiff_live_..." 
            autocomplete="off" 
            spellcheck="false" 
            required>
        </div>

        <div id="tokenErrorBox" class="token-error-box d-none" role="alert"></div>

        <button type="submit" id="tokenSubmitBtn" class="token-submit-btn">
          <span data-i18n="submitBtn">Patvirtinti ir Žiūrėti</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </form>

      <div class="token-gate-help" data-i18n="helpText">
        Neturite kodo? Pasitikrinkite registracijos patvirtinimo el. laišką arba kreipkitės: <a href="mailto:azuolynasfilmfestival@gmail.com">azuolynasfilmfestival@gmail.com</a>
      </div>
    </div>
  </div>

  <!-- MOUNT CONTAINER: Emptied initially; player is mounted ONLY after token verification -->
  <div id="livePlayerMount"></div>

  <script>
    (function() {
      // 1. Language Dictionary (Zero Provider Names or Technical Codes in Viewer UI)
      const I18N = {
        lt: {
          pageTitle: "Tiesioginė Transliacija | Ąžuolynas Film Fest",
          metaDesc: "Oficiali Ąžuolynas International Students Film Festival ceremonijos tiesioginė transliacija su autorizuota prieiga.",
          gateTitle: "Transliacijos Prieiga",
          gateDesc: "Tiesioginė festivalio transliacija skirta autorizuotiems žiūrovams ir klasėms. Įveskite asmeninį arba klasės prieigos kodą.",
          tokenLabel: "Prieigos kodas *",
          tokenPlaceholder: "pvz. asiff_live_...",
          submitBtn: "Patvirtinti ir Žiūrėti",
          verifyingBtn: "Tikrinama...",
          helpText: 'Neturite kodo? Pasitikrinkite registracijos patvirtinimo el. laišką arba kreipkitės: <a href="mailto:azuolynasfilmfestival@gmail.com">azuolynasfilmfestival@gmail.com</a>',
          headerTitle: "Ąžuolynas Film Fest Ceremonija",
          headerSub: "Kauno Tarptautinė Gimnazija &bull; Oficiali laureatų apdovanojimų transliacija",
          defaultViewer: "Autorizuotas žiūrovas",
          classroomLabel: "Klasės prieiga",
          exitBtn: "Atsijungti",
          streamLive: "Tiesioginis eteris aktyvus",
          streamOffline: "Transliacija dar neprasidėjo",
          streamStarting: "Signalas ruošiamas...",
          offlineTitle: "Transliacija dar neprasidėjo",
          offlineDesc: "Apdovanojimų ceremonijos tiesioginis eteris prasidės netrukus. Puslapis automatiškai atnaujins vaizdą prasidėjus transliacijai.",
          autoRetryText: "Automatinis signalo tikrinimas kas 5 s...",
          btnFullscreen: "Visas ekranas",
          btnVoting: "Žiūrovų Balsavimas &rarr;",
          errExpired: "Šio prieigos kodo galiojimo laikas pasibaigęs.",
          errRevoked: "Šis prieigos kodas negalioja arba buvo atšauktas.",
          errMaxUses: "Pasiektas maksimalus šio kodo prisijungimų limitas.",
          errNotFound: "Prieigos kodas nerastas arba neteisingas. Patikrinkite kodą.",
          errGeneral: "Nepavyko patvirtinti prieigos. Bandykite dar kartą vėliau."
        },
        en: {
          pageTitle: "Live Stream | Ąžuolynas Film Fest",
          metaDesc: "Official live stream of the Ąžuolynas International Students Film Festival awards ceremony with authorized access.",
          gateTitle: "Live Stream Access",
          gateDesc: "The festival live stream is reserved for authorized viewers and classrooms. Enter your personal or classroom code.",
          tokenLabel: "Access code *",
          tokenPlaceholder: "e.g. asiff_live_...",
          submitBtn: "Verify & Watch",
          verifyingBtn: "Verifying...",
          helpText: 'Don\'t have a code? Check your registration confirmation email or contact: <a href="mailto:azuolynasfilmfestival@gmail.com">azuolynasfilmfestival@gmail.com</a>',
          headerTitle: "Ąžuolynas Film Fest Ceremony",
          headerSub: "Kaunas International Gymnasium &bull; Official live awards ceremony",
          defaultViewer: "Authorized Viewer",
          classroomLabel: "Classroom Access",
          exitBtn: "Log out",
          streamLive: "Live broadcast in progress",
          streamOffline: "Broadcast has not started yet",
          streamStarting: "Broadcast signal connecting...",
          offlineTitle: "Broadcast Has Not Started Yet",
          offlineDesc: "The live ceremony broadcast will begin shortly. This player will automatically connect once the stream begins.",
          autoRetryText: "Auto-checking signal every 5s...",
          btnFullscreen: "Fullscreen",
          btnVoting: "Audience Voting &rarr;",
          errExpired: "This access code has expired.",
          errRevoked: "This access code is invalid or has been revoked.",
          errMaxUses: "The maximum number of connections for this code has been reached.",
          errNotFound: "Access code not found or incorrect. Please check your code.",
          errGeneral: "Could not verify access. Please try again later."
        }
      };

      // 2. Language Detection & State
      function detectLanguage() {
        const urlParams = new URLSearchParams(window.location.search);
        const qLang = urlParams.get("lang");
        if (qLang === "en" || qLang === "lt") return qLang;

        const stored = localStorage.getItem("asiff_preferred_lang") || sessionStorage.getItem("asiff_lang");
        if (stored === "en" || stored === "lt") return stored;

        const ref = (document.referrer || "").toLowerCase();
        if (ref.includes("/en/")) return "en";
        if (ref.includes("/lt/")) return "lt";

        return "lt";
      }

      let currentLang = detectLanguage();
      let isStreamLive = false;
      let checkTimer = null;
      let currentAuth = null;

      function setLanguage(lang) {
        currentLang = lang;
        try {
          localStorage.setItem("asiff_preferred_lang", lang);
          sessionStorage.setItem("asiff_lang", lang);
        } catch (e) {}

        document.documentElement.lang = lang;
        applyTranslations();
      }

      function applyTranslations() {
        const t = I18N[currentLang] || I18N.lt;

        document.title = t.pageTitle;
        const meta = document.getElementById("metaDescription");
        if (meta) meta.content = t.metaDesc;

        const titleEl = document.querySelector('[data-i18n="gateTitle"]');
        if (titleEl) titleEl.textContent = t.gateTitle;

        const descEl = document.querySelector('[data-i18n="gateDesc"]');
        if (descEl) descEl.textContent = t.gateDesc;

        const labelEl = document.querySelector('[data-i18n="tokenLabel"]');
        if (labelEl) labelEl.textContent = t.tokenLabel;

        const inputEl = document.getElementById("tokenInputField");
        if (inputEl) inputEl.placeholder = t.tokenPlaceholder;

        const submitSpan = document.querySelector('#tokenSubmitBtn span');
        if (submitSpan && !document.getElementById("tokenSubmitBtn").disabled) {
          submitSpan.textContent = t.submitBtn;
        }

        const helpEl = document.querySelector('[data-i18n="helpText"]');
        if (helpEl) helpEl.innerHTML = t.helpText;

        document.querySelectorAll(".live-lang-btn").forEach(btn => {
          if (btn.getAttribute("data-lang") === currentLang) {
            btn.classList.add("active");
          } else {
            btn.classList.remove("active");
          }
        });

        updatePlayerStageTranslations();
      }

      function bindLangButtons() {
        document.querySelectorAll(".live-lang-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            const lang = btn.getAttribute("data-lang");
            if (lang && lang !== currentLang) {
              setLanguage(lang);
            }
          });
        });
      }

      applyTranslations();
      bindLangButtons();

      // Elements
      const gateContainer = document.getElementById("liveGateContainer");
      const playerMount = document.getElementById("livePlayerMount");
      const form = document.getElementById("tokenGateForm");
      const input = document.getElementById("tokenInputField");
      const submitBtn = document.getElementById("tokenSubmitBtn");
      const errorBox = document.getElementById("tokenErrorBox");

      // Auto-check URL parameters (?t=CODE, ?token=CODE, or ?pass=CODE)
      const urlParams = new URLSearchParams(window.location.search);
      const queryToken = urlParams.get("t") || urlParams.get("token") || urlParams.get("pass");

      // Check session storage cache
      const cachedSession = sessionStorage.getItem("asiff_verified_token");
      if (cachedSession) {
        try {
          const auth = JSON.parse(cachedSession);
          if (auth.token && (!auth.expiresAt || new Date(auth.expiresAt).getTime() > Date.now())) {
            validateAndMount(auth.token, true);
          }
        } catch (e) {
          sessionStorage.removeItem("asiff_verified_token");
        }
      } else if (queryToken) {
        input.value = queryToken;
        validateAndMount(queryToken);
      }

      form.addEventListener("submit", async function(e) {
        e.preventDefault();
        const token = input.value.trim();
        if (!token) return;
        await validateAndMount(token);
      });

      async function validateAndMount(token, isSilent = false) {
        const t = I18N[currentLang] || I18N.lt;
        showError("");
        submitBtn.disabled = true;
        submitBtn.querySelector("span").textContent = t.verifyingBtn;

        try {
          // Compute SHA-256 hash
          const encoder = new TextEncoder();
          const data = encoder.encode(token);
          const hashBuffer = await crypto.subtle.digest("SHA-256", data);
          const hashArray = Array.from(new Uint8Array(hashBuffer));
          const tokenHash = hashArray.map(b => b.toString(16).padStart(2, "0")).join("");

          // 1. Try local server endpoint if available
          let validation = null;
          try {
            const srvRes = await fetch("/api/stream/validate-token", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ token, tokenHash })
            });
            if (srvRes.ok) {
              validation = await srvRes.json();
            } else if (srvRes.status === 403 || srvRes.status === 400) {
              const errData = await srvRes.json();
              throw new Error(mapErrorCode(errData.error || errData.code));
            }
          } catch (netErr) {
            if (netErr.message && !netErr.message.includes("Failed to fetch")) {
              throw netErr;
            }
          }

          // 2. Query Firestore stream_tokens document directly
          if (!validation) {
            const fsUrl = `https://firestore.googleapis.com/v1/projects/filmfest-509606/databases/ai-studio-azuolynasinterna-cd7ce36e-5213-4751-8aa0-a7141d397a83/documents/stream_tokens/${tokenHash}`;
            const fsRes = await fetch(fsUrl);
            
            if (fsRes.status === 404) {
              const fsViewerUrl = `https://firestore.googleapis.com/v1/projects/filmfest-509606/databases/ai-studio-azuolynasinterna-cd7ce36e-5213-4751-8aa0-a7141d397a83/documents/live_viewers/${encodeURIComponent(token)}`;
              const fsVRes = await fetch(fsViewerUrl);
              if (fsVRes.status === 404) {
                throw new Error(t.errNotFound);
              }
              const vDoc = await fsVRes.json();
              validation = {
                valid: true,
                tokenType: "individual",
                label: vDoc.fields?.name?.stringValue || t.defaultViewer,
                playbackUrl: "https://customer-auu36r7owuzogvfb.cloudflarestream.com/937d1a8b2c545a980c9fabc8502d8af4/iframe"
              };
            } else if (fsRes.ok) {
              const doc = await fsRes.json();
              const f = doc.fields || {};
              const isActive = f.isActive ? f.isActive.booleanValue !== false : true;
              const maxUses = f.maxUses ? parseInt(f.maxUses.integerValue || "1", 10) : (f.maxConcurrentDevices ? parseInt(f.maxConcurrentDevices.integerValue || "35", 10) : 35);
              const currentUses = f.currentUses ? parseInt(f.currentUses.integerValue || "0", 10) : 0;
              const expiresAt = f.expiresAt?.timestampValue ? new Date(f.expiresAt.timestampValue) : null;
              const tokenType = f.tokenType?.stringValue || (maxUses > 1 ? "classroom" : "individual");

              if (!isActive) throw new Error(t.errRevoked);
              if (expiresAt && expiresAt.getTime() < Date.now()) throw new Error(t.errExpired);
              if (currentUses >= maxUses && tokenType !== "classroom") throw new Error(t.errMaxUses);

              validation = {
                valid: true,
                tokenType: tokenType,
                maxDevices: maxUses,
                label: f.label?.stringValue || (tokenType === "classroom" ? t.classroomLabel : t.defaultViewer),
                playbackUrl: "https://customer-auu36r7owuzogvfb.cloudflarestream.com/937d1a8b2c545a980c9fabc8502d8af4/iframe",
                expiresAt: expiresAt ? expiresAt.toISOString() : null
              };
            } else {
              throw new Error(t.errNotFound);
            }
          }

          if (validation && validation.valid) {
            currentAuth = validation;
            sessionStorage.setItem("asiff_verified_token", JSON.stringify({
              token: token,
              tokenType: validation.tokenType,
              maxDevices: validation.maxDevices,
              label: validation.label,
              expiresAt: validation.expiresAt
            }));

            // Strip token parameter from browser URL bar to prevent link leakage
            if (window.history && window.history.replaceState) {
              const cleanUrl = window.location.pathname + (window.location.search ? window.location.search.replace(/[?&](t|token|pass)=[^&]+/g, "").replace(/^&/, "?") : "");
              window.history.replaceState({}, document.title, cleanUrl || window.location.pathname);
            }

            mountLivePlayer(validation);
          } else {
            throw new Error(validation?.message || t.errGeneral);
          }

        } catch (err) {
          if (!isSilent) {
            showError(err.message || t.errNotFound);
          }
          if (window.reportAsiffError) {
            window.reportAsiffError({
              action: "Prieigos kodo patvirtinimas",
              message: err.message || "Token verification failure",
              code: "AUTH_TOKEN_FAILED",
              file: "live.html",
              functionName: "validateAndMount"
            });
          }
        } finally {
          submitBtn.disabled = false;
          submitBtn.querySelector("span").textContent = t.submitBtn;
        }
      }

      function showError(msg) {
        if (!msg) {
          errorBox.textContent = "";
          errorBox.classList.add("d-none");
        } else {
          errorBox.textContent = msg;
          errorBox.classList.remove("d-none");
        }
      }

      function mapErrorCode(code) {
        const t = I18N[currentLang] || I18N.lt;
        switch (code) {
          case "expired": return t.errExpired;
          case "revoked": return t.errRevoked;
          case "max_uses_reached": return t.errMaxUses;
          case "invalid": return t.errNotFound;
          default: return t.errNotFound;
        }
      }

      function mountLivePlayer(auth) {
        if (gateContainer && gateContainer.parentNode) {
          gateContainer.remove();
        }

        const t = I18N[currentLang] || I18N.lt;
        const stage = document.createElement("main");
        stage.className = "live-player-stage";
        stage.id = "livePlayerStage";

        const isClassroom = auth.tokenType === "classroom";
        const badgeLabel = isClassroom 
          ? `🏫 ${escapeHtml(auth.label || t.classroomLabel)} (${auth.maxDevices || 35})`
          : `👤 ${escapeHtml(auth.label || t.defaultViewer)}`;

        stage.innerHTML = `
          <!-- Row 1: Festival Branding Header -->
          <div class="live-brand-row">
            <img 
              src="https://firebasestorage.googleapis.com/v0/b/azuolynas-film-fest.firebasestorage.app/o/azuolynasfilmfest.webp?alt=media" 
              alt="Ąžuolynas Fest" 
              class="live-brand-logo">
            <div class="live-brand-info">
              <h1 class="live-brand-title" id="stageHeaderTitle">${t.headerTitle}</h1>
              <p class="live-brand-sub" id="stageHeaderSub">${t.headerSub}</p>
            </div>
          </div>

          <!-- Row 2: Compact Action Toolbar (Never overlaps the video player!) -->
          <div class="live-toolbar-row">
            <div class="live-toolbar-left">
              <div class="live-lang-switch">
                <button type="button" class="live-lang-btn ${currentLang === 'lt' ? 'active' : ''}" data-lang="lt">LT</button>
                <button type="button" class="live-lang-btn ${currentLang === 'en' ? 'active' : ''}" data-lang="en">EN</button>
              </div>
            </div>
            <div class="live-toolbar-right">
              <div class="live-user-pill ${isClassroom ? 'classroom' : ''}" id="stageUserLabel" title="${escapeHtml(auth.label || '')}">
                ${badgeLabel}
              </div>
              <button type="button" id="liveExitBtn" class="live-exit-btn">${t.exitBtn}</button>
            </div>
          </div>

          <!-- Row 3: 16:9 Video Stage Container -->
          <div class="player-responsive-wrap" id="playerWrapper">
            <iframe 
              id="streamPlayerIframe"
              src="${auth.playbackUrl}"
              title="Ąžuolynas Film Festival Live Player"
              allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture; fullscreen"
              allowfullscreen>
            </iframe>

            <!-- Offline Overlay (Initially hidden if live, shown if broadcast not yet started) -->
            <div id="streamOfflineOverlay" class="stream-offline-overlay d-none">
              <div class="stream-offline-pulse"></div>
              <h2 class="stream-offline-title" id="offlineTitle">${t.offlineTitle}</h2>
              <p class="stream-offline-desc" id="offlineDesc">${t.offlineDesc}</p>
              <div class="stream-retry-badge" id="offlineRetry">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
                <span>${t.autoRetryText}</span>
              </div>
            </div>
          </div>

          <!-- Row 4: Unified Status Bar & Controls (Single source of truth) -->
          <div class="live-bottom-bar">
            <div id="unifiedStatusPill" class="live-status-pill is-offline">
              <span class="live-status-dot"></span>
              <span id="unifiedStatusText">${t.streamOffline}</span>
            </div>

            <div class="live-bottom-actions">
              <button type="button" id="btnFullscreenToggle" class="btn-fullscreen">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                <span id="btnFullscreenLabel">${t.btnFullscreen}</span>
              </button>

              <a href="voting.html" id="stageVotingLink" class="btn-voting-direct">
                ${t.btnVoting}
              </a>
            </div>
          </div>
        `;

        playerMount.appendChild(stage);
        bindLangButtons();

        // Bind Exit button
        const exitBtn = stage.querySelector("#liveExitBtn");
        exitBtn.addEventListener("click", () => {
          sessionStorage.removeItem("asiff_verified_token");
          window.location.reload();
        });

        // Bind Fullscreen Toggle
        const fsBtn = stage.querySelector("#btnFullscreenToggle");
        const playerWrap = stage.querySelector("#playerWrapper");
        if (fsBtn && playerWrap) {
          fsBtn.addEventListener("click", () => {
            if (!document.fullscreenElement) {
              if (playerWrap.requestFullscreen) {
                playerWrap.requestFullscreen();
              } else if (playerWrap.webkitRequestFullscreen) {
                playerWrap.webkitRequestFullscreen();
              }
            } else {
              if (document.exitFullscreen) {
                document.exitFullscreen();
              }
            }
          });
        }

        // Start Stream State Monitor & Auto-retry
        startStreamStateMonitor();
      }

      function updatePlayerStageTranslations() {
        const stage = document.getElementById("livePlayerStage");
        if (!stage) return;
        const t = I18N[currentLang] || I18N.lt;

        const hTitle = stage.querySelector("#stageHeaderTitle");
        if (hTitle) hTitle.textContent = t.headerTitle;

        const hSub = stage.querySelector("#stageHeaderSub");
        if (hSub) hSub.innerHTML = t.headerSub;

        const exitBtn = stage.querySelector("#liveExitBtn");
        if (exitBtn) exitBtn.textContent = t.exitBtn;

        const fsLabel = stage.querySelector("#btnFullscreenLabel");
        if (fsLabel) fsLabel.textContent = t.btnFullscreen;

        const votingLink = stage.querySelector("#stageVotingLink");
        if (votingLink) votingLink.innerHTML = t.btnVoting;

        const offTitle = stage.querySelector("#offlineTitle");
        if (offTitle) offTitle.textContent = t.offlineTitle;

        const offDesc = stage.querySelector("#offlineDesc");
        if (offDesc) offDesc.textContent = t.offlineDesc;

        const offRetry = stage.querySelector("#offlineRetry span");
        if (offRetry) offRetry.textContent = t.autoRetryText;

        updateStreamStatusUI(isStreamLive);
      }

      function updateStreamStatusUI(isLive) {
        const t = I18N[currentLang] || I18N.lt;
        const pill = document.getElementById("unifiedStatusPill");
        const text = document.getElementById("unifiedStatusText");
        const overlay = document.getElementById("streamOfflineOverlay");

        isStreamLive = isLive;

        if (pill && text) {
          if (isLive) {
            pill.className = "live-status-pill is-live";
            text.textContent = t.streamLive;
            if (overlay) overlay.classList.add("d-none");
          } else {
            pill.className = "live-status-pill is-offline";
            text.textContent = t.streamOffline;
            // Show friendly offline overlay if broadcast hasn't started
            if (overlay) overlay.classList.remove("d-none");
          }
        }
      }

      // Stream State Monitor & Auto-Reconnect
      function startStreamStateMonitor() {
        if (checkTimer) clearInterval(checkTimer);

        async function checkStatus() {
          try {
            // Check festival settings document in Firestore for live broadcast trigger
            const fsUrl = `https://firestore.googleapis.com/v1/projects/filmfest-509606/databases/ai-studio-azuolynasinterna-cd7ce36e-5213-4751-8aa0-a7141d397a83/documents/settings/festival`;
            const res = await fetch(fsUrl);
            if (res.ok) {
              const doc = await res.json();
              const f = doc.fields || {};
              const liveFlag = f.streamLive ? f.streamLive.booleanValue === true : (f.broadcastActive ? f.broadcastActive.booleanValue === true : false);
              
              const wasOffline = !isStreamLive;
              updateStreamStatusUI(liveFlag);

              // If stream just went live from offline, refresh iframe automatically without page reload
              if (wasOffline && liveFlag) {
                const iframe = document.getElementById("streamPlayerIframe");
                if (iframe && currentAuth) {
                  iframe.src = currentAuth.playbackUrl;
                }
              }
            }
          } catch (e) {
            // Fallback: check overlay API
            try {
              const res = await fetch("/api/broadcast/overlay");
              if (res.ok) {
                const data = await res.json();
                const liveFlag = data.isLive === true || data.streamLive === true;
                updateStreamStatusUI(liveFlag);
              }
            } catch (err) {}
          }
        }

        checkStatus();
        checkTimer = setInterval(checkStatus, 5000);
      }

      function escapeHtml(str) {
        if (!str) return "";
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }
    })();
  </script>
</body>
