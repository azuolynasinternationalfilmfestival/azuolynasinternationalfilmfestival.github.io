<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiesioginė Transliacija | Live Stream | Ąžuolynas Film Fest</title>
  <meta name="description" content="Oficiali Ąžuolynas International Students Film Festival ceremonijos tiesioginė transliacija su autorizuota prieiga.">
  <link rel="icon" type="image/webp" href="https://firebasestorage.googleapis.com/v0/b/azuolynas-film-fest.firebasestorage.app/o/azuolynasfilmfest.webp?alt=media">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="live.css">
  <script src="error-reporting.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    /* Zero-exposure gate layout */
    .token-gate-viewport {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: radial-gradient(circle at 50% 20%, rgba(12, 36, 31, 0.95) 0%, rgba(4, 19, 16, 0.98) 100%);
    }
    .token-gate-card {
      background: rgba(8, 27, 23, 0.92);
      border: 1px solid rgba(212, 175, 55, 0.45);
      border-radius: var(--site-radius, 12px);
      padding: 36px 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85);
      text-align: center;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .token-gate-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.35);
      color: #D4AF37;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .token-gate-title {
      font-family: var(--font-cinema, Georgia, serif);
      font-size: 1.45rem;
      color: #F8FAF7;
      margin: 0 0 10px 0;
      letter-spacing: 0.03em;
    }
    .token-gate-desc {
      font-size: 0.88rem;
      color: #94a3b8;
      line-height: 1.5;
      margin: 0 0 24px 0;
    }
    .token-input-wrap {
      margin-bottom: 16px;
      text-align: left;
    }
    .token-input-wrap label {
      display: block;
      font-size: 0.8rem;
      color: #cbd5e1;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .token-input-field {
      width: 100%;
      padding: 12px 14px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(111, 165, 138, 0.35);
      border-radius: 6px;
      color: #F8FAF7;
      font-size: 1rem;
      letter-spacing: 0.05em;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      box-sizing: border-box;
    }
    .token-input-field:focus {
      border-color: #D4AF37;
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
    }
    .token-error-box {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      margin-bottom: 16px;
      text-align: left;
      line-height: 1.4;
    }
    .token-submit-btn {
      width: 100%;
      padding: 13px;
      background: #D4AF37;
      color: #041310;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }
    .token-submit-btn:hover {
      background: #F3E5AB;
      transform: translateY(-1px);
    }
    .token-submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .token-gate-help {
      margin-top: 20px;
      font-size: 0.78rem;
      color: #64748b;
      line-height: 1.4;
    }
    .token-gate-help a {
      color: #D4AF37;
      text-decoration: none;
    }
    .token-gate-help a:hover {
      text-decoration: underline;
    }

    /* Live Player Mounted Stage */
    .live-player-stage {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 16px 64px 16px;
      width: 100%;
      box-sizing: border-box;
    }
    .live-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(111, 165, 138, 0.2);
    }
    .live-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .live-brand img {
      width: 38px;
      height: 38px;
      border-radius: 50%;
    }
    .live-brand-title {
      font-family: var(--font-cinema, Georgia, serif);
      font-size: 1.25rem;
      color: #F8FAF7;
      margin: 0;
    }
    .live-brand-sub {
      font-size: 0.75rem;
      color: #94a3b8;
      margin: 0;
    }
    .live-user-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(111, 165, 138, 0.15);
      border: 1px solid rgba(111, 165, 138, 0.35);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      color: #F8FAF7;
    }
    .live-exit-btn {
      background: transparent;
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #f87171;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      margin-left: 8px;
      transition: background 0.2s ease;
    }
    .live-exit-btn:hover {
      background: rgba(239, 68, 68, 0.15);
    }
    .player-responsive-wrap {
      position: relative;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #000000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(212, 175, 55, 0.3);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.8);
      margin-bottom: 24px;
    }
    .player-responsive-wrap iframe,
    .player-responsive-wrap video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    .stream-offline-card {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, #081B17 0%, #030d0b 100%);
      color: #F8FAF7;
      text-align: center;
      padding: 24px;
    }
    .stream-offline-pulse {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #D4AF37;
      box-shadow: 0 0 15px #D4AF37;
      margin-bottom: 14px;
      animation: pulseDot 2s infinite ease-in-out;
    }
    .stream-offline-title {
      font-family: var(--font-cinema, Georgia, serif);
      font-size: 1.35rem;
      color: #D4AF37;
      margin: 0 0 8px 0;
    }
    .stream-offline-desc {
      font-size: 0.88rem;
      color: #94a3b8;
      max-width: 480px;
      line-height: 1.5;
      margin: 0;
    }
  </style>
</head>
<body class="site-body">

  <!-- =========================================================================
       INITIAL DOM: STRICT TOKEN GATE ONLY (Zero stream exposure before validation)
       ========================================================================= -->
  <div id="liveGateContainer" class="token-gate-viewport">
    <div class="token-gate-card">
      <div class="token-gate-icon" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>

      <h1 class="token-gate-title">Transliacijos Prieiga</h1>
      <p class="token-gate-desc">
        Tiesioginė festivalio transliacija skirta autorizuotiems žiūrovams. Įveskite savo asmeninį prieigos žetoną.
      </p>

      <form id="tokenGateForm" action="javascript:void(0);">
        <div class="token-input-wrap">
          <label for="tokenInputField">Asmeninis žetonas (Token) *</label>
          <input 
            type="text" 
            id="tokenInputField" 
            class="token-input-field" 
            placeholder="pvz. asiff_live_..." 
            autocomplete="off" 
            spellcheck="false" 
            required>
        </div>

        <div id="tokenErrorBox" class="token-error-box d-none" role="alert"></div>

        <button type="submit" id="tokenSubmitBtn" class="token-submit-btn">
          <span>Patvirtinti ir Žiūrėti</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </form>

      <div class="token-gate-help">
        Neturite kodo? Pasitikrinkite registracijos patvirtinimo laišką arba kreipkitės: <a href="mailto:azuolynasfilmfestival@gmail.com">azuolynasfilmfestival@gmail.com</a>
      </div>
    </div>
  </div>

  <!-- MOUNT CONTAINER: Emptied initially; player is mounted ONLY after token verification -->
  <div id="livePlayerMount"></div>

  <script>
    (function() {
      const gateContainer = document.getElementById("liveGateContainer");
      const playerMount = document.getElementById("livePlayerMount");
      const form = document.getElementById("tokenGateForm");
      const input = document.getElementById("tokenInputField");
      const submitBtn = document.getElementById("tokenSubmitBtn");
      const errorBox = document.getElementById("tokenErrorBox");

      // Auto-check URL parameters (?token=... or ?pass=...)
      const urlParams = new URLSearchParams(window.location.search);
      const queryToken = urlParams.get("token") || urlParams.get("pass");

      // Check session storage cache
      const cachedSession = sessionStorage.getItem("asiff_verified_token");
      if (cachedSession) {
        try {
          const auth = JSON.parse(cachedSession);
          if (auth.token && (!auth.expiresAt || new Date(auth.expiresAt).getTime() > Date.now())) {
            validateAndMount(auth.token, true);
          }
        } catch (e) {
          sessionStorage.removeItem("asiff_verified_token");
        }
      } else if (queryToken) {
        input.value = queryToken;
        validateAndMount(queryToken);
      }

      form.addEventListener("submit", async function(e) {
        e.preventDefault();
        const token = input.value.trim();
        if (!token) return;
        await validateAndMount(token);
      });

      async function validateAndMount(token, isSilent = false) {
        showError("");
        submitBtn.disabled = true;
        submitBtn.querySelector("span").textContent = "Tikrinama...";

        try {
          // Compute SHA-256 hash
          const encoder = new TextEncoder();
          const data = encoder.encode(token);
          const hashBuffer = await crypto.subtle.digest("SHA-256", data);
          const hashArray = Array.from(new Uint8Array(hashBuffer));
          const tokenHash = hashArray.map(b => b.toString(16).padStart(2, "0")).join("");

          // 1. Try local server endpoint first if available
          let validation = null;
          try {
            const srvRes = await fetch("/api/stream/validate-token", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ token, tokenHash })
            });
            if (srvRes.ok) {
              validation = await srvRes.json();
            } else if (srvRes.status === 403 || srvRes.status === 400) {
              const errData = await srvRes.json();
              throw new Error(errData.message || getErrorMessage(errData.error));
            }
          } catch (netErr) {
            if (netErr.message && !netErr.message.includes("Failed to fetch")) {
              throw netErr;
            }
          }

          // 2. If not validated via local route, query Firestore stream_tokens document directly
          if (!validation) {
            const fsUrl = `https://firestore.googleapis.com/v1/projects/filmfest-509606/databases/ai-studio-azuolynasinterna-cd7ce36e-5213-4751-8aa0-a7141d397a83/documents/stream_tokens/${tokenHash}`;
            const fsRes = await fetch(fsUrl);
            
            if (fsRes.status === 404) {
              // Also check live_viewers collection for backwards compatibility
              const fsViewerUrl = `https://firestore.googleapis.com/v1/projects/filmfest-509606/databases/ai-studio-azuolynasinterna-cd7ce36e-5213-4751-8aa0-a7141d397a83/documents/live_viewers/${encodeURIComponent(token)}`;
              const fsVRes = await fetch(fsViewerUrl);
              if (fsVRes.status === 404) {
                throw new Error("Prieigos žetonas nerastas arba negalioja. Patikrinkite kodą.");
              }
              const vDoc = await fsVRes.json();
              validation = {
                valid: true,
                label: vDoc.fields?.name?.stringValue || "Žiūrovas",
                playbackUrl: "https://customer-auu36r7owuzogvfb.cloudflarestream.com/937d1a8b2c545a980c9fabc8502d8af4/iframe"
              };
            } else if (fsRes.ok) {
              const doc = await fsRes.json();
              const f = doc.fields || {};
              const isActive = f.isActive ? f.isActive.booleanValue !== false : true;
              const maxUses = f.maxUses ? parseInt(f.maxUses.integerValue || "1", 10) : 1;
              const currentUses = f.currentUses ? parseInt(f.currentUses.integerValue || "0", 10) : 0;
              const expiresAt = f.expiresAt?.timestampValue ? new Date(f.expiresAt.timestampValue) : null;

              if (!isActive) throw new Error("Šis žetonas buvo atšauktas administratoriaus.");
              if (expiresAt && expiresAt.getTime() < Date.now()) throw new Error("Šio žetono galiojimo laikas pasibaigęs.");
              if (currentUses >= maxUses) throw new Error("Viršytas leistinų šio žetono prisijungimų limitas.");

              validation = {
                valid: true,
                label: f.label?.stringValue || "Žiūrovas",
                playbackUrl: "https://customer-auu36r7owuzogvfb.cloudflarestream.com/937d1a8b2c545a980c9fabc8502d8af4/iframe",
                expiresAt: expiresAt ? expiresAt.toISOString() : null
              };
            } else {
              throw new Error("Nepavyko patikrinti prieigos žetono.");
            }
          }

          if (validation && validation.valid) {
            sessionStorage.setItem("asiff_verified_token", JSON.stringify({
              token: token,
              label: validation.label,
              expiresAt: validation.expiresAt
            }));

            mountLivePlayer(validation);
          } else {
            throw new Error(validation?.message || "Prieiga nesuteikta.");
          }

        } catch (err) {
          if (!isSilent) {
            showError(err.message || "Prieiga atmesta. Patikrinkite žetoną.");
          }
          if (window.reportAsiffError) {
            window.reportAsiffError({
              action: "Transliacijos žetono patvirtinimas",
              message: err.message || "Token verification failure",
              code: "AUTH_TOKEN_FAILED",
              file: "live.html",
              functionName: "validateAndMount"
            });
          }
        } finally {
          submitBtn.disabled = false;
          submitBtn.querySelector("span").textContent = "Patvirtinti ir Žiūrėti";
        }
      }

      function showError(msg) {
        if (!msg) {
          errorBox.textContent = "";
          errorBox.classList.add("d-none");
        } else {
          errorBox.textContent = msg;
          errorBox.classList.remove("d-none");
        }
      }

      function getErrorMessage(code) {
        switch (code) {
          case "expired": return "Šio žetono galiojimo laikas pasibaigęs.";
          case "revoked": return "Šis žetonas buvo atšauktas administratoriaus.";
          case "max_uses_reached": return "Pasiektas maksimalus leistinų prisijungimų limitas.";
          case "invalid": return "Neteisingas arba neegzistuojantis žetonas.";
          default: return "Prieigos klaida. Bandykite vėliau.";
        }
      }

      function mountLivePlayer(auth) {
        // Remove token gate completely from DOM
        gateContainer.remove();

        const stage = document.createElement("main");
        stage.className = "live-player-stage";
        stage.innerHTML = `
          <header class="live-top-bar">
            <div class="live-brand">
              <img src="https://firebasestorage.googleapis.com/v0/b/azuolynas-film-fest.firebasestorage.app/o/azuolynasfilmfest.webp?alt=media" alt="Ąžuolynas Fest">
              <div>
                <h1 class="live-brand-title">Ąžuolynas Film Fest Ceremonija</h1>
                <p class="live-brand-sub">Kauno Tarptautinė Gimnazija &bull; Oficiali laureatų apdovanojimų transliacija</p>
              </div>
            </div>
            <div style="display:flex; align-items:center;">
              <div class="live-user-pill">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <span>${escapeHtml(auth.label || "Autorizuotas žiūrovas")}</span>
              </div>
              <button type="button" id="liveExitBtn" class="live-exit-btn">Atsijungti</button>
            </div>
          </header>

          <div class="player-responsive-wrap" id="playerWrapper">
            <iframe 
              id="cfPlayerIframe"
              src="${auth.playbackUrl}"
              title="Ąžuolynas Film Festival Live Player"
              allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture; fullscreen"
              allowfullscreen>
            </iframe>
          </div>

          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-top:16px;">
            <div style="display:flex; align-items:center; gap:8px;">
              <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#4ade80;"></span>
              <span style="font-size:0.85rem; color:#cbd5e1;">Ryšys su Cloudflare Stream transliacija aktyvus</span>
            </div>
            <a href="voting.html" class="btn-solid" style="padding:8px 18px; font-size:0.85rem; background:#D4AF37; color:#041310; text-decoration:none; border-radius:6px; font-weight:700;">
              Atverti Žiūrovų Balsavimą &rarr;
            </a>
          </div>
        `;

        playerMount.appendChild(stage);

        const exitBtn = stage.querySelector("#liveExitBtn");
        exitBtn.addEventListener("click", () => {
          sessionStorage.removeItem("asiff_verified_token");
          window.location.reload();
        });
      }

      function escapeHtml(str) {
        if (!str) return "";
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }
    })();
  </script>
</body>
</html>
